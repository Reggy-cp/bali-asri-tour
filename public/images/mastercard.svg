<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 115" width="160" height="115" fill="none">
  <defs>
    <clipPath id="left-circle-clip">
      <circle cx="56" cy="44" r="34" />
    </clipPath>
  </defs>
  <!-- Background subtle card border if desired, or transparent -->
  <g>
    <!-- Left Circle (Red) -->
    <circle cx="56" cy="44" r="34" fill="#EB001B" />
    <!-- Right Circle (Yellow) -->
    <circle cx="96" cy="44" r="34" fill="#F79E1B" />
    <!-- Overlap / Intersection (Orange) -->
    <circle cx="96" cy="44" r="34" fill="#FF5F00" clip-path="url(#left-circle-clip)" />
    <!-- Wordmark -->
    <text x="76" y="98" font-family="'Mark Pro', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#141414" text-anchor="middle" letter-spacing="-0.4">mastercard</text>
  </g>
</svg>